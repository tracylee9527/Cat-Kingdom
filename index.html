<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Capy Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-shaped app column on graph paper. Top resource bar, scrolling content, five-tab bottom nav (hidden during a run). */
:root{
  --paper:#e6eddb; --grid:#d2dcc3; --card:#f8faf1; --sunk:#edf2e3; --ink:#253020; --muted:#5a6851; --shadow:#253020;
  --sky:#d9eae4; --hill:#c4d6ae; --hill2:#a9c393; --ground:#b5c897; --trail:#d9cfa8;
  --capy:#a46f3c; --capy-dk:#6b4524; --yuzu:#e5821a; --leaf:#3f8a3c; --water:#3d8c92;
  --good:#2b8543; --bad:#c23d2b; --onyuzu:#2a1805; --gold:#b98a12;
  --ch1:#8fb06a; --ch2:#9b8bb8; --ch3:#6fa9b5; --ch4:#d39a52; --ch5:#7f8fc7; --ch6:#c27766;
  --f-display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Mali","Comic Sans MS",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#131a15; --grid:#1d2820; --card:#1b231d; --sunk:#162019; --ink:#e3ebd5; --muted:#9aa98e; --shadow:#000;
  --sky:#17232a; --hill:#24342a; --hill2:#2c4231; --ground:#2b3b2a; --trail:#46412d;
  --capy:#bb8452; --capy-dk:#7c5332; --yuzu:#f29a36; --leaf:#5aad55; --water:#5aaeb3;
  --good:#5fc077; --bad:#ef6c57; --onyuzu:#2a1805; --gold:#e2b544;
  --ch1:#4f6e3a; --ch2:#5b4f78; --ch3:#3c6a74; --ch4:#86602f; --ch5:#46528a; --ch6:#7d4639; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#131a15; --grid:#1d2820; --card:#1b231d; --sunk:#162019; --ink:#e3ebd5; --muted:#9aa98e; --shadow:#000;
  --sky:#17232a; --hill:#24342a; --hill2:#2c4231; --ground:#2b3b2a; --trail:#46412d;
  --capy:#bb8452; --capy-dk:#7c5332; --yuzu:#f29a36; --leaf:#5aad55; --water:#5aaeb3;
  --good:#5fc077; --bad:#ef6c57; --onyuzu:#2a1805; --gold:#e2b544;
  --ch1:#4f6e3a; --ch2:#5b4f78; --ch3:#3c6a74; --ch4:#86602f; --ch5:#46528a; --ch6:#7d4639; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.app{max-width:500px;margin:0 auto;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.topbar{padding-inline:16px;padding-block:10px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-size:24px;line-height:1;letter-spacing:.4px}
.brand span{color:var(--yuzu)}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);border:1.5px solid var(--ink);display:inline-block}
.main{overflow-y:auto;padding-inline:16px;padding-block:6px 24px;display:grid;grid-auto-rows:max-content;gap:12px;align-content:start;min-width:0}
.nav[hidden]{display:none}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:7px 0 6px;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;padding:3px;border-radius:9px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{background:var(--yuzu);color:var(--onyuzu)}
.nav .center svg{width:34px;height:34px;margin-top:-14px;background:var(--card);border:2px solid var(--ink);border-radius:50%;padding:5px}
.nav .center[aria-current="page"] svg{background:var(--yuzu)}

/* generic */
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:3px 3px 0 var(--shadow);display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.card h3{margin:0;font-size:15px}
.card p{margin:0}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center}
.chip{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ink);color:var(--card)}
.chip.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--muted)}
.chip.boss{background:var(--bad);color:var(--card)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:.6em 1em;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s;text-align:left}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn:disabled{cursor:default;opacity:.55}
.btn.primary{background:var(--yuzu);color:var(--onyuzu);text-align:center}
.btn.big{font-family:var(--f-display);font-weight:400;font-size:22px;padding:.45em 1em;letter-spacing:.5px}
.btn.small{padding:.3em .75em;font-size:13px}
.btn.ghost{box-shadow:none;border-style:dashed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:9px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--bad);transition:width .25s}
.bar.enemy>i{background:var(--muted)}
.bar.good>i{background:var(--leaf)}

/* scene */
.scene{position:relative;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky);box-shadow:3px 3px 0 var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
.scene.walking .trail-dash{animation:march .45s linear infinite}
.scene.walking .capy-body{animation:bob .3s ease-in-out infinite alternate}
.idle .capy-body{animation:breathe 2.4s ease-in-out infinite}
@keyframes march{to{transform:translateX(-24px)}}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes breathe{50%{transform:translateY(-1.5px)}}
.lunge{animation:lunge .25s ease-out}
.recoil{animation:recoil .25s ease-out}
.enemy-lunge{animation:elunge .25s ease-out}
@keyframes lunge{50%{transform:translateX(18px)}}
@keyframes recoil{50%{transform:translateX(-14px)}}
@keyframes elunge{50%{transform:translateX(-18px)}}
.float{position:absolute;font-family:var(--f-num);font-weight:500;font-size:15px;pointer-events:none;animation:rise .85s ease-out forwards;color:var(--ink);text-shadow:0 1px 0 var(--card)}
.float.hurt{color:var(--bad)} .float.crit{color:var(--yuzu);font-size:20px;font-family:var(--f-display)} .float.heal{color:var(--good)} .float.zap{color:var(--water)}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-36px);opacity:0}}

/* adventure home */
.chapter{gap:10px}
.chap-top{display:flex;align-items:center;gap:8px}
.chap-top .grow{text-align:center;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.chap-name{font-family:var(--f-display);font-size:26px;line-height:1.05;text-wrap:balance}
.arrow{width:38px;height:38px;border-radius:50%;padding:0;text-align:center;flex:none}
.topics{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--grid)}
.progress-line{display:flex;align-items:center;gap:10px;font-size:13px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{background:var(--sunk);border-radius:10px;padding:6px 8px;display:grid;gap:0;text-align:center;min-width:0}
.st b{font-family:var(--f-num);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.st span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.locked{opacity:.6}

/* lists (gear/talents/shop) */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px;box-shadow:3px 3px 0 var(--shadow)}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--sunk)}
.ico svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.item h3{margin:0;font-size:15px;line-height:1.2}
.item p{margin:0;font-size:12.5px;color:var(--muted)}
.rar{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.r0{color:var(--muted)} .r1{color:var(--leaf)} .r2{color:var(--water)} .r3{color:var(--ch2)} .r4{color:var(--yuzu)}
.cost{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:13px}
.sectitle{font-family:var(--f-display);font-size:20px;margin:4px 0 -2px}

/* library */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.mastery{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center}
.mrow .lab{font-weight:700;font-size:14px;line-height:1.2}
.mrow .lab small{display:block;font-weight:400;color:var(--muted);font-family:var(--f-num);font-size:11.5px}
.ref{display:grid;gap:10px}
.ref dl{margin:0;display:grid;gap:8px}
.ref dt{font-weight:700}
.ref dd{margin:0;color:var(--muted);font-size:13.5px}
.ref .grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--yuzu);font-weight:700;margin-top:6px}
.formula{font-family:var(--f-num);font-size:13.5px;background:var(--sunk);border-radius:8px;padding:6px 10px;color:var(--ink);display:block;margin-top:3px;overflow-x:auto}

/* run */
.hud{display:grid;gap:7px}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hud-ch{font-family:var(--f-display);font-size:19px;line-height:1.1}
.daychip{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.daychip b{color:var(--ink);font-size:16px}
.pips{display:flex;gap:3px;align-items:center}
.pip{flex:1;height:8px;border-radius:4px;background:var(--grid);border:1.5px solid var(--muted);opacity:.7}
.pip.done{background:var(--leaf);border-color:var(--leaf);opacity:1}
.pip.now{background:var(--yuzu);border-color:var(--ink);opacity:1}
.pip.boss{flex:0 0 12px;height:12px;border-radius:2px;transform:rotate(45deg)}
.hp{display:flex;align-items:center;gap:10px}
.stats{display:flex;flex-wrap:wrap;gap:5px}
.stat{font-family:var(--f-num);font-size:11.5px;padding:2px 8px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.stat.insight{border-color:var(--yuzu)}
.skillrow{display:flex;flex-wrap:wrap;gap:5px}
.sk{font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--grid)}

/* problem card */
.dia{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.dia .shape{fill:var(--sunk);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.dia .fillacc{fill:var(--yuzu);opacity:.25;stroke:none}
.dia .ln{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.dia .thin{stroke:var(--ink);stroke-width:1.4;fill:none}
.dia .dash{stroke-dasharray:5 4}
.dia .gl{stroke:var(--muted);stroke-width:.6;opacity:.4}
.dia .ax{stroke:var(--muted);stroke-width:1.2}
.dia .dot{fill:var(--ink)}
.dia text{font-family:var(--f-num);font-size:12.5px;fill:var(--ink);dominant-baseline:central}
.dia .vl{font-family:var(--f-body);font-weight:700;font-size:13px}
.dia .q{fill:var(--yuzu);font-weight:500;font-size:14px}
.dia .sm{font-size:10px;fill:var(--muted)}
.qtext{font-size:16px;font-weight:600;text-wrap:pretty}
.defq{display:block;font-weight:400;font-style:italic;margin-top:6px;padding:8px 12px;background:var(--sunk);border-radius:8px}
.given{font-size:14px;display:grid;gap:2px}
.given b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:6px}
.proof{width:100%;border-collapse:collapse;font-size:13px}
.proof-wrap{overflow-x:auto}
.proof th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 6px;border-bottom:2px solid var(--ink)}
.proof td{padding:5px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
.proof td:first-child{font-family:var(--f-num);color:var(--muted);width:1.6em}
.proof tr.blank td{background:var(--sunk)}
.proof .qm{font-family:var(--f-display);color:var(--yuzu);font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;min-width:0}
.opt .k{font-family:var(--f-num);font-size:11px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;border:1.5px solid var(--muted);color:var(--muted);flex:none}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.mono .t{font-family:var(--f-num);font-weight:500;font-size:15px}
.opt.right{background:var(--good);color:var(--card);border-color:var(--good);opacity:1}
.opt.wrong{background:var(--bad);color:var(--card);border-color:var(--bad);opacity:1}
.opt.right .k,.opt.wrong .k{border-color:var(--card);color:var(--card)}
.opt.gone{visibility:hidden}
.feedback{border-radius:10px;padding:10px 12px;border:2px dashed var(--muted);display:grid;gap:10px}
.feedback.ok{border-color:var(--good)} .feedback.no{border-color:var(--bad)}
.feedback b.v{font-family:var(--f-display);font-weight:400;font-size:18px}
.feedback.ok b.v{color:var(--good)} .feedback.no b.v{color:var(--bad)}
.choices{display:grid;gap:8px}
.choice{display:grid;gap:2px}
.choice strong{font-size:15px}
.choice span{font-weight:400;font-size:13px;color:var(--muted)}
.choice .lv{font-family:var(--f-num);font-size:11px;color:var(--yuzu)}
.estats{font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.log{font-size:13px;min-height:5.6em;display:grid;gap:1px;align-content:start;color:var(--muted)}
.log div:last-child{color:var(--ink)}
.tbl{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-family:var(--f-num);font-size:13px;justify-content:start}
.tbl span:nth-child(odd){color:var(--muted)}
.confirm{display:grid;gap:8px;padding:10px;border:2px dashed var(--bad);border-radius:10px}
@media (max-width:400px){.opts{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.mrow{grid-template-columns:minmax(0,1fr) 60px auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main"></main>
  <nav class="nav" id="nav" aria-label="Menu"></nav>
</div>

<script>
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const neg=s=>String(s).replace(/-/g,'−');
const cap=s=>s[0].toUpperCase()+s.slice(1);
const DEG=Math.PI/180, sinD=d=>Math.sin(d*DEG), cosD=d=>Math.cos(d*DEG), tanD=d=>Math.tan(d*DEG);
const asinD=v=>Math.asin(v)/DEG, acosD=v=>Math.acos(v)/DEG, atanD=v=>Math.atan(v)/DEG;
const fI=v=>neg(Math.round(v));
const fD=v=>Math.round(v)+'°';
const f1=v=>neg((Math.round(v*10)/10).toFixed(1));
const fNice=v=>{const r=Math.round(v*10)/10;return neg(Number.isInteger(r)?String(r):r.toFixed(1))};
const u=(fmt,unit)=>v=>fmt(v)+unit;
function frac(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return neg(d===1?String(n):`${n}/${d}`)}
function piF(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;const top=n===1?'π':n===-1?'−π':neg(n)+'π';return d===1?top:top+'/'+d}
function simpRoot(n){let k=1,m=n;for(let i=Math.floor(Math.sqrt(n));i>1;i--){if(n%(i*i)===0){k=i;m=n/(i*i);break}}return[k,m]}
function rad(c,n){if(n===0)return'0';const[k,m]=simpRoot(n);const K=c*k;if(m===1)return String(K);return(K===1?'':K)+'√'+m}
function pt(x,y){return neg(`(${x}, ${y})`)}
function expr(a,b){const ax=a===1?'x':a===-1?'−x':neg(a)+'x';if(b===0)return ax;return `${ax} ${b<0?'−':'+'} ${Math.abs(b)}`}
function uniq(ans,cands,n=4){const out=[ans],seen=new Set([ans]);for(const c of cands){if(out.length>=n)break;if(c==null)continue;const s=String(c);if(!s||/NaN|Infinity|undefined/.test(s))continue;if(!seen.has(s)){seen.add(s);out.push(s)}}return out}
function numOpts(ans,cands,fmt,o={}){
  const pos=o.pos!==false;const A=fmt(ans);
  const out=uniq(A,cands.filter(v=>Number.isFinite(v)&&(!pos||v>0)).map(fmt));
  const st=o.step||Math.max(Math.abs(ans)*0.11,0.4);let k=1;
  while(out.length<4&&k<60){const v=ans+(k%2?1:-1)*Math.ceil(k/2)*st;if(!pos||v>0){const s=fmt(v);if(!out.includes(s))out.push(s)}k++}
  return shuffle(out);
}
function strOpts(ans,cands){return shuffle(uniq(ans,cands))}

/* ================= drawing helpers ================= */

  if(k==='vol'){const ans=piF(4*r**3,3);return{sec:SEC.MEA,topic:'Spheres',q:'Find the volume of the sphere in terms of π.',svg:W(s),ans,opts:strOpts(ans,[piF(4*r*r,1),piF(r**3,1),piF(4*r**3,1),piF(2*r**3,3)]),explain:`V = (4/3)πr³ = (4/3)π(${r**3}) = ${ans}.`}}
  if(k==='hemi'){const ans=piF(2*r**3,3);return{sec:SEC.MEA,topic:'Spheres',q:`Find the volume of a hemisphere with radius ${r} in terms of π.`,ans,opts:strOpts(ans,[piF(4*r**3,3),piF(2*r*r,1),piF(r**3,3),piF(3*r*r,1)]),explain:`Half of (4/3)πr³: (2/3)π(${r**3}) = ${ans}.`}}
  if(k==='back'){const ans=String(r);return{sec:SEC.MEA,topic:'Spheres',q:`A sphere has surface area ${4*r*r}π. Find its radius.`,ans,opts:strOpts(ans,[String(r*r),String(2*r),rad(1,4*r*r)==String(2*r)?String(r+1):rad(1,4*r*r),String(r*4),String(r+2)]),explain:`4πr² = ${4*r*r}π → r² = ${r*r} → r = ${r}.`}}
  const ans=piF(4*r*r,1);return{sec:SEC.MEA,topic:'Spheres',q:'Find the surface area of the sphere in terms of π.',svg:W(s),ans,opts:strOpts(ans,[piF(4*r**3,3),piF(2*r*r,1),piF(r*r,1),piF(8*r,1)]),explain:`SA = 4πr² = 4π(${r*r}) = ${ans}.`};
}
function gCyl(){
  const r=R(2,8),h=R(3,12);const k=pick(['vol','sa']);const s=solidFig('cyl')+T([160,147],'r = '+r)+T([198,86],'h = '+h,'start');
  if(k==='vol'){const ans=piF(r*r*h,1);return{sec:SEC.MEA,topic:'Cylinders',q:'Find the volume of the cylinder in terms of π.',svg:W(s),ans,opts:strOpts(ans,[piF(2*r*h,1),piF(r*r*h,3),piF(2*r*r*h,1),piF(r*h,1)]),explain:`V = πr²h = π(${r*r})(${h}) = ${ans}.`}}
  const ans=piF(2*r*r+2*r*h,1);return{sec:SEC.MEA,topic:'Cylinders',q:'Find the total surface area of the cylinder in terms of π.',svg:W(s),ans,opts:strOpts(ans,[piF(2*r*h,1),piF(r*r+2*r*h,1),piF(2*r*r+r*h,1),piF(r*r*h,1)]),explain:`SA = 2πr² + 2πrh = ${2*r*r}π + ${2*r*h}π = ${ans}.`};
}
function gPyr(){
  const [half,h,sl]=pick([[3,4,5],[4,3,5],[6,8,10],[5,12,13],[8,6,10],[8,15,17],[9,12,15]]);const b=2*half;const k=pick(['vol','slant']);
  const s=solidFig('pyr')+T([110,150],'base '+b+' × '+b)+T([136,72],k==='vol'?'h = '+h:'slant = '+sl,'start');
  const ans=fI(b*b*h/3);return{sec:SEC.MEA,topic:'Pyramids',q:k==='vol'?'Find the volume of the square pyramid.':'The slant height of each face is shown. Find the volume of the square pyramid.',svg:W(s),ans,opts:numOpts(b*b*h/3,[b*b*h,b*b*sl/3,b*h/3*4,b*b*h/2],fI,{step:8}),
    explain:`${k==='slant'?`Height: √(${sl}² − ${half}²) = ${h}. `:''}V = ⅓Bh = ⅓(${b*b})(${h}) = ${b*b*h/3}.`};
}
function gSolidRatio(){
  const a=R(1,4);let b=R(2,6);while(b===a)b=R(2,6);const V=a**3*R(2,5);const ans=V*b**3/a**3;
  return{sec:SEC.MEA,topic:'Similar solids',q:`Two similar cones have heights ${a} cm and ${b} cm. The smaller has volume ${V} cm³. Find the volume of the larger.`,ans:fI(ans)+' cm³',opts:numOpts(ans,[V*b*b/(a*a),V*b/a,V+b**3-a**3],u(fNice,' cm³'),{step:10}),
    explain:`Volumes scale by the cube of the scale factor: ${V} × (${b}/${a})³ = ${ans} cm³.`};
}

function askProblem(el,p,o){
  const long=p.opts.some(x=>x.replace(/<[^>]+>/g,'').length>18);const mono=!long&&!p.keep&&p.sec!==SEC.PRF&&p.sec!==SEC.DEF;
  el.innerHTML=`<div class="card">
    <div class="chips"><span class="chip ${o.boss?'boss':''}">${o.label}</span><span class="chip ghost">${p.sec} · ${p.topic}</span></div>
    ${p.svg||''}${p.proof||''}
    <p class="qtext">${p.q}</p>
    <div class="opts ${long?'one':''}">${p.opts.map((x,i)=>`<button class="btn opt ${mono?'mono':''}" data-i="${i}"><span class="k">${i+1}</span><span class="t">${x}</span></button>`).join('')}</div>
    ${o.hints!==false?`<div class="row"><button class="btn small ghost" id="hint" ${SV.hints<1?'disabled':''}>Use a hint feather (${SV.hints} left)</button></div>`:''}
    <div id="fb" hidden></div></div>`;
  let done=false;
  const answer=i=>{if(done)return;done=true;ACTIVE=null;const ok=p.opts[i]===p.ans;recordMastery(p.sec,ok);
    el.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(p.opts[j]===p.ans)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
    const h=el.querySelector('#hint');if(h)h.disabled=true;
    const r=o.after(ok);const fb=el.querySelector('#fb');fb.hidden=false;fb.className='feedback '+(ok?'ok':'no');
    fb.innerHTML=`<b class="v">${r.title}</b><p>${p.explain}${r.extra?' '+r.extra:''}</p><button class="btn primary" id="cont">${r.label}</button>`;
    const c=fb.querySelector('#cont');c.onclick=r.action;c.focus({preventScroll:true});fb.scrollIntoView({block:'nearest',behavior:'smooth'});
  };
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const hb=el.querySelector('#hint');if(hb)hb.onclick=()=>{if(SV.hints<1||done)return;SV.hints--;save();const wrong=shuffle(p.opts.map((x,j)=>j).filter(j=>p.opts[j]!==p.ans)).slice(0,p.opts.length>3?2:1);wrong.forEach(j=>el.querySelectorAll('.opt')[j].classList.add('gone'));hb.disabled=true;hb.textContent=`Hint used (${SV.hints} left)`;if(S&&S.mode==='run')renderHUD()};
  ACTIVE=answer;
}

  const b=baseStats();

function walk(ms=1100){const s=$('#scene');if(!s)return;s.classList.add('walking');setTimeout(()=>s.classList.remove('walking'),ms)}
function enemySVG(e){
  const n=e.n,r=e.boss?36:e.mini?31:27,pts=[];

    <path d="M-15 ${ey-9} L-4 ${ey-5} M15 ${ey-9} L4 ${ey-5}" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><path d="M-6 ${ey+12} q6 -4 12 0" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>`;

function newGate(){
  S.phase='gate';showEnemy(null);renderHUD();
  const boss=S.day===BOSS||S.day===MINI;if(S.need==null||S.need<1)S.need=boss?2:1;

function gateResult(ok){
  if(ok){S.streak++;S.solved++;S.yuzu+=3;let extra='';if(S.solved%3===0){S.atk+=1;extra='Three more solved: +1 ATK.'}S.need--;renderHUD();
    if(S.need>0)return{title:'One lock opens.',extra,label:'Next lock',action:newGate};

  const dmg=Math.max(1,Math.round(S.maxHp*(.12-.01*tl('steady'))));S.hp-=dmg;S.streak=Math.max(0,S.streak-2);S.missed++;anim('#capy','recoil');floatAt('capy','-'+dmg,'hurt');renderHUD();

function rollEvent(){
  S.phase='event';S.need=null;
  if(S.day===BOSS)return encounter(makeEnemy('boss'));
  if(S.day===MINI)return encounter(makeEnemy('mini'));
  const r=Math.random();

const COLORS=['#d8644a','#8f7d6b','#6c8fb3','#5f9d5b','#9a6bb5','#c7922e','#4c7a55','#b5577a'];
function enemyStats(c,d,kind){const m=Math.pow(1.42,c),ma=Math.pow(1.33,c);let hp=(26+9*d)*m,atk=(4+.8*d)*ma,def=Math.floor(d/3)*(c+1);if(kind==='mini'){hp*=1.7;atk*=1.1}if(kind==='boss'){hp*=2.4;atk*=1.25;def+=c+1}return{hp:Math.round(hp),atk,def}}
function makeEnemy(kind){const ch=CHAPTERS[S.ch];const st=enemyStats(S.ch,S.day,kind);const name=kind==='boss'?ch.boss:kind==='mini'?ch.mini:pick(ch.foes);
  return{name,boss:kind==='boss',mini:kind==='mini',n:kind==='boss'?12:kind==='mini'?6:R(3,8),color:kind==='boss'?COLORS[(S.ch+6)%8]:pick(COLORS),...st,maxHp:st.hp}}

function bwait(){return battle.skip?Promise.resolve():sleep(battle.fast?170:420)}
function blog(t){if(battle.skip)return;battle.log.push(t);if(battle.log.length>4)battle.log.shift();const el=$('#blog');if(el)el.innerHTML=battle.log.map(x=>`<div>${x}</div>`).join('')}
function bupdate(){const e=battle.e;const b=$('#ebar');if(b)b.style.width=Math.max(0,e.hp/e.maxHp*100)+'%';const n=$('#ehp');if(n)n.textContent=Math.max(0,Math.round(e.hp))+' / '+e.maxHp;renderHUD()}
async function runBattle(e){
  S.phase='battle';battle={e,fast:battle?battle.fast:false,skip:false,log:[]};const myRun=S;
  $('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip ${e.boss||e.mini?'boss':''}">${e.name}</span><span class="num" id="ehp">${Math.round(e.hp)} / ${e.maxHp}</span></div>
    <div class="bar enemy"><i id="ebar" style="width:${e.hp/e.maxHp*100}%"></i></div><div class="log" id="blog" aria-live="polite"></div>
    <div class="row"><button class="btn small" id="spd">${battle.fast?'Speed 2×':'Speed 1×'}</button><span class="grow"></span><button class="btn small" id="skip">Skip to result</button></div></div>`;
  $('#spd').onclick=()=>{battle.fast=!battle.fast;$('#spd').textContent=battle.fast?'Speed 2×':'Speed 1×'};
  $('#skip').onclick=()=>{battle.skip=true};
  let turn=0;
  while(S===myRun&&S.hp>0&&e.hp>0&&turn<400){
    turn++;const hits=chance(.15*lv('twin'))?2:1;
    for(let h=0;h<hits&&e.hp>0;h++){let dmg=Math.max(1,Math.round(effAtk()*(.9+Math.random()*.2)-e.def));const crit=chance(critChance());if(crit)dmg=Math.round(dmg*(1.8+.3*lv('compass')));
      e.hp-=dmg;if(!battle.skip)anim('#capy','lunge');floatAt('enemy',(crit?'CRIT ':'')+dmg,crit?'crit':'');blog(`${h?'Second bite':crit?'Insight crit':'Capybara bites'} for ${dmg}.`);
      const heal=Math.round(dmg*.1*lv('leech'));if(heal>0)S.hp=Math.min(S.maxHp,S.hp+heal)}
    if(e.hp>0&&chance(.2*lv('zap'))){const z=Math.round(effAtk()*1.1);e.hp-=z;floatAt('enemy','zap '+z,'zap');blog(`Yuzu zap for ${z}.`)}
    bupdate();await bwait();if(S!==myRun)return;if(e.hp<=0)break;
    const dmg=Math.max(1,Math.round(e.atk*(.9+Math.random()*.2)-effDef()));S.hp-=dmg;if(!battle.skip){anim('#enemy','enemy-lunge');anim('#capy','recoil')}floatAt('capy','-'+dmg,'hurt');blog(`${e.name} hits for ${dmg}.`);
    const th=Math.round(dmg*.2*lv('thorn'));if(th>0){e.hp-=th;blog(`Burr fur reflects ${th}.`)}
    const rg=Math.round(S.maxHp*.03*lv('spring'));if(rg>0&&S.hp>0){S.hp=Math.min(S.maxHp,S.hp+rg);floatAt('capy','+'+rg,'heal')}
    bupdate();await bwait();if(S!==myRun)return;
  }
  if(S!==myRun)return;
  S.hp=Math.round(S.hp);bupdate();
  if(S.hp<=0)return reviveOffer(e);
  showEnemy(null);S.kills++;if(e.boss||e.mini)S.bosses++;
  if(e.boss)return endRun('win');
  const y=(4+S.day)*(e.mini?3:1);S.yuzu+=y;S.atk+=1;S.maxHp+=6;S.hp=Math.min(S.maxHp,S.hp+6);renderHUD();
  const learnIt=e.mini||chance(.4);
  $('#panel').innerHTML=`<div class="card"><h2>${e.name} defeated.</h2><p>+${y} yuzu · +1 ATK · +6 max HP${learnIt?' · a new skill to learn':''}</p><button class="btn primary" id="cont">${learnIt?'Choose a skill':'Walk on'}</button></div>`;
  $('#cont').onclick=()=>learnIt?skillChoice('Victory lesson','Pick one:',afterEvent):afterEvent();$('#cont').focus({preventScroll:true});
}
function reviveOffer(e){
  if(S.revived)return endRun('lose',e);
  S.phase='revive';
  const p=genFrom(CHAPTERS[S.ch].pool[2],2);
  $('#panel').innerHTML='';
  const wrap=document.createElement('div');wrap.style.display='grid';wrap.style.gap='12px';wrap.innerHTML=`<div class="card"><h2>Second wind</h2><p class="muted">Your capybara is down. Solve one hard problem to get back up at half health. This works once per run.</p></div><div id="rv"></div>`;
  $('#panel').appendChild(wrap);
  askProblem($('#rv'),p,{label:'Second wind',boss:true,after:ok=>{S.revived=true;
    if(ok){S.hp=Math.round(S.maxHp/2);renderHUD();return{title:'Back on its paws!',label:e?'Keep fighting':'Back to the trail',action:()=>e?runBattle(e):newGate()}}
    return{title:'Not this time.',label:'See results',action:()=>endRun('lose',e)}}});
}
function skillChoice(title,lead,then){
  const avail=Object.keys(SKILLS).filter(k=>lv(k)<3);
  if(!avail.length){S.atk+=2;renderHUD();$('#panel').innerHTML=`<div class="card"><h2>${title}</h2><p>Every skill is maxed. +2 ATK instead.</p><button class="btn primary" id="c">Walk on</button></div>`;$('#c').onclick=then;return}
  const opts=shuffle(avail).slice(0,3);
  $('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip">Skill</span></div><h2>${title}</h2><p class="muted">${lead}</p>
    <div class="choices">${opts.map(k=>`<button class="btn choice" data-k="${k}"><span class="lv">${lv(k)?'Level '+lv(k)+' → '+(lv(k)+1):'New'}</span><strong>${SKILLS[k].name}</strong><span>${SKILLS[k].desc}</span></button>`).join('')}</div></div>`;
  $('#panel').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{learn(b.dataset.k);renderHUD();then()});
}
function spring(){const heal=Math.round(S.maxHp*.35);S.hp=Math.min(S.maxHp,S.hp+heal);renderHUD();floatAt('capy','+'+heal,'heal');
  $('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip">Rest</span></div><h2>A warm spring steams by the trail.</h2><p>Your capybara soaks until its whiskers droop. +${heal} HP.</p><button class="btn primary" id="c">Walk on</button></div>`;$('#c').onclick=afterEvent}
function chest(){const r=R(0,3);let msg;
  if(r===0){const g=R(10,20);S.yuzu+=g;msg=`${g} yuzu, slightly damp.`}else if(r===1){S.atk+=2+S.ch;msg=`A sharpening stone. +${2+S.ch} ATK.`}else if(r===2){S.def+=1+Math.floor(S.ch/2);msg=`A sturdy bark vest. +${1+Math.floor(S.ch/2)} DEF.`}else{const h=15+8*S.ch;S.maxHp+=h;S.hp+=h;msg=`A bundle of sweet grass. +${h} max HP.`}
  renderHUD();$('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip">Find</span></div><h2>Something half-buried in the reeds.</h2><p>${msg}</p><button class="btn primary" id="c">Walk on</button></div>`;$('#c').onclick=afterEvent}
function trader(msg=''){
  const c=S.ch;const items=[
    {id:'heal',name:'Herbal snack',desc:'Heal 40% HP',cost:12,buy:()=>{S.hp=Math.min(S.maxHp,S.hp+Math.round(S.maxHp*.4))}},
    {id:'atk',name:'Whetstone',desc:`+${3+c} ATK`,cost:22,buy:()=>{S.atk+=3+c}},
    {id:'def',name:'Bark vest',desc:`+${2+Math.floor(c/2)} DEF`,cost:20,buy:()=>{S.def+=2+Math.floor(c/2)}},
    {id:'scroll',name:'Trail scroll',desc:'Learn a skill',cost:30}];
  renderHUD();
  $('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip">Trader</span><span class="estats">${S.yuzu} yuzu</span></div><h2>An old tortoise has set out a blanket of goods.</h2>${msg?`<p class="muted" role="status">${msg}</p>`:''}
    <div class="choices">${items.map(it=>`<button class="btn choice" data-id="${it.id}" ${S.yuzu<it.cost?'disabled':''}><span class="lv">${it.cost} yuzu</span><strong>${it.name}</strong><span>${it.desc}</span></button>`).join('')}</div>
    <button class="btn primary" id="leave">Leave and walk on</button></div>`;
  $('#panel').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const it=items.find(x=>x.id===b.dataset.id);if(S.yuzu<it.cost)return;S.yuzu-=it.cost;
    if(it.id==='scroll')return skillChoice('Trail scroll','Pick one:',()=>trader('Scroll read.'));it.buy();trader(`Bought ${it.name.toLowerCase()}.`)});
  $('#leave').onclick=afterEvent;
}
function afterEvent(){S.day++;SV.best[S.ch]=Math.max(SV.best[S.ch]||0,S.day-1);save();if(S.day>DAYS)return endRun('win');S.need=null;walk();newGate()}
function retreatAsk(){
  if(!S||S.phase==='over')return;const p=$('#panel');if(p.querySelector('.confirm'))return;
  const box=document.createElement('div');box.className='confirm';box.innerHTML=`<p><b>Leave the trail?</b> You keep the coins earned so far (about ${reward().total}).</p><div class="row"><button class="btn small" id="rk">Keep going</button><button class="btn small primary" id="ry">Retreat</button></div>`;
  p.prepend(box);box.scrollIntoView({block:'nearest'});$('#rk').onclick=()=>box.remove();$('#ry').onclick=()=>endRun('retreat');
}
function reward(){const c=S.ch+1;const days=Math.max(0,S.day-1);const base=days*(5+5*c)+S.solved*2+S.kills*(2+c)+S.bosses*25*c;const mult=1+.08*tl('scholar');return{total:Math.round(base*mult),days}}
function endRun(how,e){
  if(!S)return;const r=reward();S.phase='over';ACTIVE=null;if(battle)battle.skip=true;
  let unlocked='';
  if(how==='win'){SV.best[S.ch]=DAYS;if(SV.cleared<=S.ch){SV.cleared=S.ch+1;if(S.ch+1<CHAPTERS.length){unlocked=`${CHAPTERS[S.ch+1].name} is now open.`;SV.sel=S.ch+1}}r.total+=50*(S.ch+1);r.days=DAYS}
  SV.coins+=r.total;save();showEnemy(null);if(how==='win')walk(2000);
  const acc=S.solved+S.missed?Math.round(S.solved/(S.solved+S.missed)*100):0;const ch=CHAPTERS[S.ch];
  const title=how==='win'?`${ch.name} cleared.`:how==='retreat'?'You head home early.':'The capybara curls up for a long nap.';
  const sub=how==='win'?`The ${ch.boss} is down. ${unlocked}`:how==='retreat'?`You left on day ${S.day}.`:`${e?`The ${e.name} won`:'The trail won'} on day ${S.day}.`;
  renderHUD();
  $('#panel').innerHTML=`<div class="card"><div class="chips"><span class="chip ${how==='win'?'':'ghost'}">${how==='win'?'Chapter complete':'Run over'}</span></div><h2>${title}</h2><p>${sub}</p>
    <div class="tbl"><span>Days cleared</span><span>${r.days}</span><span>Problems solved</span><span>${S.solved}</span><span>Accuracy</span><span>${acc}%</span><span>Coins earned</span><span>${r.total}</span></div>
    <p class="note">Spend coins on gear and talents to push further.</p><button class="btn primary" id="home">Back to camp</button></div>`;
  $('#retreat')&&($('#retreat').hidden=true);
  $('#home').onclick=()=>{UI.tab=how==='win'?'adv':'gear';home()};$('#home').focus({preventScroll:true});
}

/* ================= practice ================= */
function startPractice(sec){
  S={mode:'practice',sec,i:0,n:6,right:0,coins:0};$('#nav').hidden=true;
  $('#topbar').innerHTML=`<div class="brand">Capy<span>Trail</span></div><div class="res"><button class="btn small ghost" id="quit">Back to library</button></div>`;
  $('#quit').onclick=()=>{SV.coins+=S.coins;save();UI.tab='lib';home()};
  $('#main').innerHTML=`<div class="card" style="gap:6px"><div class="row"><b class="grow">${sec}</b><span class="num" id="pp"></span></div><div class="bar good"><i id="pbar" style="width:0%"></i></div></div><div id="panel"></div>`;
  practiceNext();
}
function practiceNext(){
  $('#pp').textContent=`${S.i+1} / ${S.n}`;$('#pbar').style.width=(S.i/S.n*100)+'%';
  const p=genFrom(SECTION_POOLS[S.sec],R(1,2));
  askProblem($('#panel'),p,{label:'Practice',after:ok=>{if(ok){S.right++;S.coins+=4}S.i++;$('#pbar').style.width=(S.i/S.n*100)+'%';
    return{title:ok?'Correct. +4 coins':'Not quite.',label:S.i<S.n?'Next problem':'Finish',action:S.i<S.n?practiceNext:practiceEnd}}});
  $('#main').scrollTop=0;
}
function practiceEnd(){
  SV.coins+=S.coins;save();const [c,n]=SV.mastery[S.sec]||[0,0];
  $('#panel').innerHTML=`<div class="card"><h2>${S.right} of ${S.n} right.</h2><p>+${S.coins} coins. Lifetime ${S.sec}: ${c}/${n} (${n?Math.round(c/n*100):0}%).</p><div class="row"><button class="btn primary" id="again">Another set</button><button class="btn" id="back">Back to library</button></div></div>`;
  const sec=S.sec;$('#again').onclick=()=>startPractice(sec);$('#back').onclick=()=>{UI.tab='lib';home()};S.coins=0;
}

home();
</script>

</body></html>
